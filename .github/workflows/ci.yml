name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check API handlers
        run: |
          node --check api/create-checkout.js
          node --check api/extract-ticket.js
          node --check api/send-letter.js

      - name: Secret scan
        run: |
          ! grep -RInE 'sk_live|rk_live|whsec_|MF_SEC_KEY=|MF_PUB_KEY=|STRIPE_SECRET_KEY=|ANTHROPIC_API_KEY=' \
            api static index.html send-reclamation.js package.json package-lock.json
